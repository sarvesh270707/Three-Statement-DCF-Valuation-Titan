name: Titan Company Ltd. Three-Statement & DCF Quality Assurance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly regression run at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  financial-qa-audit:
    name: Titan Model Audit & Automated Quality Gates
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Finance_FP&A_Portfolio/shared/requirements.txt
        pip install pytest playwright
        python -m playwright install chromium

    - name: Execute Project 01 Titan Model Validation
      run: |
        python Finance_FP&A_Portfolio/Project_01_Titan_Three_Statement_DCF/scripts/model_validation.py

    - name: Run Complete Automated Pytest Regression Suite
      run: |
        pytest tests/ -v --junitxml=reports/regression/junit_report.xml

    - name: Upload Audit Reports Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: titan-dcf-audit-reports
        path: |
          reports/
          outputs/
          DEFECT_REGISTER.csv
          TEST_EXECUTION_LOG.csv
